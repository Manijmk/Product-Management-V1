services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pms-postgres:/var/lib/postgresql/data

volumes:
  pms-postgres:
